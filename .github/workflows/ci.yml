name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.12'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            apps/api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: make validate
      - run: python scripts/validate_environment_config.py
      - uses: aws-actions/setup-sam@v3
      - name: Validate and build the SAM application
        working-directory: infra/sam
        run: |
          sam validate --lint --template-file template.yaml
          sam build --config-env dev --use-container
      - name: Verify source-only Lambda package layout
        run: |
          SKIP_DEPENDENCIES=true ./scripts/package_lambda.sh
          unzip -l dist/aws-friendly-counsellor-lambda-arm64.zip | grep aws_friendly_counsellor/
          unzip -l dist/aws-friendly-counsellor-lambda-arm64.zip | grep aws_friendly_counsellor_contracts/
          ! unzip -l dist/aws-friendly-counsellor-lambda-arm64.zip | grep -E 'tests/|docs/|apps/|packages/'
