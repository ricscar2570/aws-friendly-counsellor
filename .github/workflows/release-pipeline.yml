name: Release pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12'
  ARTIFACT_NAME: awsfc-sam-${{ github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      git_sha: ${{ steps.metadata.outputs.git_sha }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python scripts/validate_release_ref.py --environment production --ref "${{ github.ref_name }}"
      - run: make validate
      - run: python scripts/validate_environment_config.py
      - uses: aws-actions/setup-sam@v3
      - name: Build the immutable arm64 SAM artifact once
        working-directory: infra/sam
        run: sam build --config-env staging --use-container
      - name: Record release metadata
        id: metadata
        run: |
          EXACT_SHA=$(git rev-parse HEAD)
          printf '{"release":"%s","git_sha":"%s"}\n' "${{ github.ref_name }}" "$EXACT_SHA" > release-metadata.json
          echo "git_sha=$EXACT_SHA" >> "$GITHUB_OUTPUT"
          tar -C infra/sam -czf release-bundle.tgz .aws-sam/build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            release-bundle.tgz
            release-metadata.json
            supply-chain/sbom.cdx.json
            supply-chain/evidence.sha256
          if-no-files-found: error
          retention-days: 30

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: staging
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
      - run: tar -C infra/sam -xzf release-bundle.tgz
      - uses: aws-actions/setup-sam@v3
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: awsfc-release-staging-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy exact release artifact to staging
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GIT_SHA: ${{ needs.build.outputs.git_sha }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ENABLE_GRADUAL_DEPLOYMENT: ${{ vars.ENABLE_GRADUAL_DEPLOYMENT || 'false' }}
          SAM_ARTIFACT_BUCKET: ${{ vars.SAM_ARTIFACT_BUCKET }}
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          SKIP_BUILD: 'true'
        run: ./scripts/deploy_environment.sh staging
      - name: Smoke test staging
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name aws-friendly-counsellor-staging \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          python scripts/smoke_test.py --base-url "$API_URL" --expected-environment staging --expected-release "${{ github.ref_name }}"

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
      - run: tar -C infra/sam -xzf release-bundle.tgz
      - uses: aws-actions/setup-sam@v3
      - uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: awsfc-release-production-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Promote the same artifact to production
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          GIT_SHA: ${{ needs.build.outputs.git_sha }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
          ENABLE_GRADUAL_DEPLOYMENT: ${{ vars.ENABLE_GRADUAL_DEPLOYMENT || 'false' }}
          SAM_ARTIFACT_BUCKET: ${{ vars.SAM_ARTIFACT_BUCKET }}
          CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
          SKIP_BUILD: 'true'
        run: ./scripts/deploy_environment.sh production
      - name: Smoke test production
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name aws-friendly-counsellor-production \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          python scripts/smoke_test.py --base-url "$API_URL" --expected-environment production --expected-release "${{ github.ref_name }}"
